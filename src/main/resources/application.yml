server:
  port: 8080

spring:
  application:
    name: spring-kafka-showcase
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      transaction-id-prefix: tx-
      properties:
        enable.idempotence: true
        partitioner.class: com.example.springkafka.partitioner.RegionAwarePartitioner
    consumer:
      group-id: showcase-default-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.springkafka.*"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: RECORD

app:
  kafka:
    topics:
      standard: "orders.standard"
      high-priority: "orders.high-priority"
      retryable: "orders.retryable"
      retryable-dlt: "orders.retryable.DLT"
      batch: "orders.batch"
      transactional: "events.transactional"
      nonblocking: "orders.nonblocking"
      manual-ack: "orders.manual-ack"
      compacted-inventory: "inventory.compacted"
      streams-input: "streams.orders.input"
      streams-output: "streams.analytics.output"
      outbox-cdc: "orders.outbox.cdc"
      joined-output: "orders.joined.output"
      encrypted: "orders.encrypted"
      tiered-retention: "orders.tiered.retention"
      events-sourced: "events.sourced"
      saga-orders-commands: "saga.orders.commands"
      saga-inventory-commands: "saga.inventory.commands"
      saga-completed: "saga.events.completed"
      streams-shipments: "streams.shipments.input"
      streams-orders-shipments-joined: "streams.orders-shipments.joined"
      user-sessions: "user.sessions.input"
      cdc-raw: "orders.cdc.raw"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  file:
    name: logs/spring-kafka-showcase.log
  level:
    root: INFO
    com.example.springkafka: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN


